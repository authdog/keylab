name: Feature request
description: Suggest a change to keylab
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you cannot do with keylab today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: The behavior you want, including any algorithm or runtime constraints.
    validations:
      required: true
