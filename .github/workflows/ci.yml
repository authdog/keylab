name: CI

on:
  push:
    paths:
      - src/**
      - biome.json
      - tsconfig.json
      - scripts/**
      - docs/**
      - package.json
      - bun.lock
      - vitest.config.ts
      - vitest.setup.ts
      - .github/workflows/ci.yml
  pull_request:
    paths:
      - src/**
      - biome.json
      - tsconfig.json
      - scripts/**
      - docs/**
      - package.json
      - bun.lock
      - vitest.config.ts
      - vitest.setup.ts
      - .github/workflows/ci.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Dependency review
        uses: actions/dependency-review-action@v5

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    strategy:
      matrix:
        node-version: [24.x]

    steps:
      - uses: actions/checkout@v6
        with:
          show-progress: false

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Type check
        run: bun run typecheck

      - name: Run tests with coverage
        run: bun run test-with-coverage
        env:
          NODE_ENV: test
          STAGE: test
          CI: true

      - name: Generate coverage badge
        id: coverage-badge
        run: |
          COVERAGE=$(bun scripts/generate-coverage-badge.ts)
          echo "coverage=$COVERAGE" >> "$GITHUB_OUTPUT"
          echo "## Coverage" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Current line coverage: **$COVERAGE**" >> "$GITHUB_STEP_SUMMARY"

      - name: Commit coverage badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: update coverage badge"
          file_pattern: badges/coverage.svg

  bundle:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The pinned version publishes; latest catches bundler regressions before a local publish does.
        bun-version: [1.2.11, latest]

    steps:
      - uses: actions/checkout@v6
        with:
          show-progress: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun-version }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build and check bundle
        run: bun run check:bundle
